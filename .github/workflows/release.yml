name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
      - run: make check
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
